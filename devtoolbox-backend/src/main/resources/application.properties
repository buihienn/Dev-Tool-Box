spring.application.name=DevToolBox Backend
spring.datasource.url =${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Local development defaults. Override these values with environment variables.
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.plugin.directory=${PLUGIN_DIRECTORY:../devtoolbox-frontend/src/plugins}

# Loading a JAR executes trusted code inside the backend process. Keep it disabled
# unless an administrator is actively developing a trusted plugin locally.
app.plugins.runtime-loading-enabled=${PLUGIN_RUNTIME_LOADING_ENABLED:false}
